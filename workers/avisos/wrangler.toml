# Reloj de los avisos a la hora (ver worker.js). Desplegado en la cuenta de
# Cloudflare de matices.app. La llave se guarda como secreto:
#   npx wrangler secret put CRON_KEY
# y su SHA-256 en public.cron_keys de Supabase.
name = "matices-avisos"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = false

[vars]
TARGET_URL = "https://www.matices.app/api/cron/reminders"
# Antes de llamar a la app pregunta aquí si ya toca algún recordatorio
# (public.reminders_due). La llave publicable es pública: sola no basta.
SUPABASE_URL = "https://tlpyuuyqbatrgfrycsjs.supabase.co"
SUPABASE_KEY = "sb_publishable_1rAyxAdk5KtNhjxChDANIA_yEQEL7SI"

[triggers]
crons = ["* * * * *"]

# Registros del Worker en Cloudflare (Workers Logs): cada vuelta y los errores
# al preguntar reminders_due quedan a la vista para revisarlos.
[observability]
enabled = true
